kind = "web"
previewPath = "/"
title = "Project Hub"
description = "A focused project management app for organizing projects, tracking tasks, monitoring progress, and keeping team work visible in one place."
version = "1.0.0"
id = "artifacts/project-hub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18869

[services.development]
run = "pnpm --filter @workspace/project-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/project-hub", "run", "build" ]
serve = "static"
publicDir = "artifacts/project-hub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18869"
BASE_PATH = "/"
